<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flute Studio 🪈 — Authentic SCAD 3D Flute & Clean Breath Ribbon</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-panel: #0e121c;
      --border: #1c2436;
      --accent: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --text: #f1f5f9;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }
    header h1 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .status-pill { font-size: 0.72rem; color: #10b981; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }

    .workspace {
      display: grid;
      grid-template-columns: 270px 1fr;
      flex: 1;
      height: calc(100vh - 45px);
      overflow: hidden;
    }

    .sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 0.70rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .field-group { margin-bottom: 8px; }
    .field-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    
    select, input[type="range"] {
      width: 100%;
      background: #080a10;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 0.78rem;
      outline: none;
    }
    input[type="range"] { accent-color: var(--accent); cursor: pointer; padding: 0; }

    button.btn-primary {
      background: var(--accent-emerald);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.80rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    button.btn-primary:hover { background: #059669; }

    button.btn-subtle {
      background: #141a27;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    button.btn-subtle:hover { background: #1f283d; }

    .stage {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: #04060a;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #101626 0%, #04060a 100%);
      overflow: hidden;
    }
    #viewport-canvas { width: 100%; height: 100%; display: block; }

    .viewport-overlay {
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(10, 14, 23, 0.88);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      pointer-events: none;
    }

    /* Minimalist Proportional Breath Ribbon */
    .timeline-dock {
      height: 175px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
    }

    .transport-bar {
      padding: 6px 14px;
      background: #0a0d15;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ribbon-scroll-container {
      flex: 1;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      background: #06080d;
    }

    .breath-ribbon {
      position: relative;
      height: 96px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #090c14;
      border: 1px solid #141b2b;
      border-radius: 8px;
      padding: 6px 10px;
      min-width: 100%;
    }

    .note-pill {
      height: 80px;
      background: #111724;
      border: 1px solid #222e44;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.15s;
    }
    .note-pill:hover { border-color: var(--accent); transform: translateY(-1px); }
    .note-pill.active {
      border-color: #10b981;
      background: #0b201a;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.35);
    }

    .pill-pitch {
      font-size: 0.82rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .pill-dots {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: #06080e;
      padding: 3px 5px;
      border-radius: 4px;
    }
    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid #60a5fa;
    }
    .pill-dot.closed { background: #3b82f6; }
    .pill-dot.open { background: transparent; border-color: #06b6d4; }

    .pill-dur {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    #ribbon-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2.5px;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
      pointer-events: none;
      z-index: 10;
      left: 10px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
</head>
<body>

<header>
  <h1>🪈 Flute Studio <span style="font-size:0.72rem; color:var(--text-muted); font-weight:normal;">Parametric CAD & Bio-Acoustics</span></h1>
  <div class="status-pill"><span class="status-dot"></span> <span id="lbl-status">Engine Ready</span></div>
</header>

<div class="workspace">
  <div class="sidebar">
    <div>
      <div class="section-label">Acoustics & Tuning</div>
      <div class="field-group">
        <label>Tone Holes</label>
        <select id="sel-holes">
          <option value="4">4 Holes (Sacred 4)</option>
          <option value="5">5 Holes (Pentatonic)</option>
          <option value="6" selected>6 Holes (Grand Native)</option>
          <option value="7">7 Holes (Diatonic)</option>
        </select>
      </div>

      <div class="field-group">
        <label>Size / Pitch Range</label>
        <select id="sel-root">
          <option value="36">C2 (Contrabass - 65 Hz)</option>
          <option value="50">D3 (Bass - 146 Hz)</option>
          <option value="60">C4 (Tenor - 261 Hz)</option>
          <option value="69" selected>A4 (Standard - 440 Hz)</option>
          <option value="72">C5 (Soprano - 523 Hz)</option>
          <option value="86">D6 (Piccolo - 1175 Hz)</option>
        </select>
      </div>

      <div class="field-group">
        <label>Scale</label>
        <select id="sel-scale">
          <option value="native_american" selected>Native American (Minor Pentatonic)</option>
          <option value="hijaz">Hijaz (Middle Eastern)</option>
          <option value="minor_pentatonic">Minor Pentatonic</option>
          <option value="major_pentatonic">Major Pentatonic</option>
          <option value="dorian">Dorian Mode</option>
          <option value="major">Major Scale</option>
          <option value="natural_minor">Natural Minor</option>
        </select>
      </div>
    </div>

    <div>
      <div class="section-label">Player Breath & Vocal Tract</div>
      <div class="field-group">
        <label>Throat Vowel</label>
        <select id="sel-vowel">
          <option value="tu" selected>Tu (Native Spirit)</option>
          <option value="ooh">Ooh (Deep Throat)</option>
          <option value="ta">Ta (Open Crown)</option>
          <option value="kee">Kee (Bright Overblow)</option>
        </select>
      </div>

      <div class="field-group">
        <label>Tongue Articulation</label>
        <select id="sel-articulation">
          <option value="none" selected>Legato Breath Flow</option>
          <option value="t_attack">T-Tonguing (Vortex Burst)</option>
          <option value="d_soft">D-Tonguing (Gentle)</option>
          <option value="flutter">Flutter-Tongue (24 Hz Rasp)</option>
        </select>
      </div>
    </div>

    <div>
      <div class="section-label">Mouthpiece Profile</div>
      <div class="field-group">
        <label>Windway Chamber</label>
        <select id="sel-profile">
          <option value="sac" selected>Slow Air Chamber (SAC)</option>
          <option value="arched">Arched Crown</option>
          <option value="venturi">Venturi Taper</option>
          <option value="flat">Flat Planar</option>
        </select>
      </div>
    </div>

    <div style="margin-top:auto;">
      <button class="btn-subtle" style="width:100%;" id="btn-export-scad">💾 Export OpenSCAD .SCAD</button>
    </div>
  </div>

  <div class="stage">
    <!-- 3D GPU Viewport: Exact SCAD Triple Flute & Moving 3D Fingers -->
    <div id="viewport-container">
      <canvas id="viewport-canvas"></canvas>
      <div class="viewport-overlay">
        <strong id="lbl-viewport-title">Parametric CAD Triple Flute</strong><br>
        <span style="color:var(--text-muted);" id="lbl-viewport-sub">Exact CAD Geometry: Converged Mouthpiece Beak, Fipples & Chimneys</span>
      </div>
    </div>

    <!-- Minimalist Breath Ribbon -->
    <div class="timeline-dock">
      <div class="transport-bar">
        <button class="btn-primary" id="btn-play">▶ Play Physical Engine</button>
        <button class="btn-subtle" id="btn-stop">⏹ Stop</button>
        
        <select id="sel-preset-melody" style="width: 190px;">
          <option value="native_motif" selected>Preset: Native Spirit</option>
          <option value="condor_pasa">Preset: El Cóndor Pasa</option>
          <option value="desert_caravan">Preset: Desert Caravan</option>
          <option value="greensleeves">Preset: Greensleeves</option>
          <option value="morning_mood">Preset: Morning Mood</option>
          <option value="amazing_grace">Preset: Amazing Grace</option>
        </select>

        <button class="btn-subtle" onclick="addNote()">➕ Add Note</button>

        <span style="font-size:0.72rem; color:var(--text-muted); margin-left:auto;">
          Click note card to cycle scale fingering • Right-click to remove
        </span>
      </div>

      <div class="ribbon-scroll-container">
        <div class="breath-ribbon" id="breath-ribbon-track">
          <div id="ribbon-playhead"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let pyodideInstance = null;
let audioContext = null;
let liveProcessorNode = null;
let isAudioRunning = false;
let dummyOsc = null;
let dummyGain = null;
let masterGainNode = null;

const SCALES = {
  native_american: [0, 3, 5, 7, 10, 12],
  hijaz: [0, 1, 4, 5, 7, 8, 10, 12],
  minor_pentatonic: [0, 3, 5, 7, 10, 12],
  major_pentatonic: [0, 2, 4, 7, 9, 12],
  dorian: [0, 2, 3, 5, 7, 9, 10, 12],
  major: [0, 2, 4, 5, 7, 9, 11, 12],
  natural_minor: [0, 2, 3, 5, 7, 8, 10, 12],
};

const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

function getMidiName(m) {
  const name = NOTE_NAMES[m % 12];
  const oct = Math.floor(m / 12) - 1;
  return `${name}${oct}`;
}

function midiToFreq(m) {
  return 440.0 * Math.pow(2.0, (m - 69.0) / 12.0);
}

function getPlayablePitches() {
  const root = parseInt(document.getElementById('sel-root').value);
  const scaleKey = document.getElementById('sel-scale').value;
  const numHoles = parseInt(document.getElementById('sel-holes').value);
  const intervals = SCALES[scaleKey] || SCALES.minor_pentatonic;

  const maxFund = Math.min(intervals.length, numHoles + 1);
  const fundIntervals = intervals.slice(0, maxFund);

  const pitches = [];
  for (let oct = 0; oct < 2; oct++) {
    for (let i of fundIntervals) {
      pitches.push(root + oct * 12 + i);
    }
  }
  return [...new Set(pitches)].sort((a, b) => a - b);
}

function quantizeMidi(target) {
  const playable = getPlayablePitches();
  if (!playable.length) return target;
  return playable.reduce((closest, p) => Math.abs(p - target) < Math.abs(closest - target) ? p : closest, playable[0]);
}

function midiToHoles(midi) {
  const root = parseInt(document.getElementById('sel-root').value);
  const scaleKey = document.getElementById('sel-scale').value;
  const numHoles = parseInt(document.getElementById('sel-holes').value);
  const intervals = SCALES[scaleKey] || SCALES.minor_pentatonic;

  const interval = (midi - root) % 12;
  const intervalIdx = intervals.indexOf(interval);

  const holes = Array(numHoles).fill(true);
  if (intervalIdx > 0) {
    for (let h = 0; h < Math.min(numHoles, intervalIdx); h++) {
      holes[h] = false;
    }
  }
  return holes;
}

let scoreNotes = [];

const PRESETS = {
  native_motif: [{ n: 0, d: 1.5 }, { n: 3, d: 0.5 }, { n: 5, d: 1.0 }, { n: 7, d: 2.0 }, { n: 10, d: 1.0 }, { n: 7, d: 1.0 }, { n: 5, d: 1.0 }, { n: 3, d: 1.0 }, { n: 0, d: 3.0 }],
  condor_pasa: [{ n: 7, d: 1.5 }, { n: 10, d: 0.5 }, { n: 12, d: 1.0 }, { n: 10, d: 0.5 }, { n: 7, d: 0.5 }, { n: 5, d: 2.0 }, { n: 7, d: 1.0 }, { n: 5, d: 0.5 }, { n: 3, d: 0.5 }, { n: 0, d: 3.0 }],
  desert_caravan: [{ n: 0, d: 1.0 }, { n: 1, d: 0.5 }, { n: 4, d: 1.5 }, { n: 5, d: 1.0 }, { n: 4, d: 0.5 }, { n: 1, d: 0.5 }, { n: 0, d: 2.0 }],
  greensleeves: [{ n: 0, d: 1.0 }, { n: 3, d: 2.0 }, { n: 5, d: 1.0 }, { n: 7, d: 1.5 }, { n: 9, d: 0.5 }, { n: 7, d: 1.0 }, { n: 5, d: 2.0 }, { n: 2, d: 1.0 }, { n: 0, d: 3.0 }],
  morning_mood: [{ n: 7, d: 0.5 }, { n: 4, d: 0.5 }, { n: 2, d: 0.5 }, { n: 0, d: 0.5 }, { n: 2, d: 0.5 }, { n: 4, d: 0.5 }, { n: 7, d: 1.5 }, { n: 9, d: 1.5 }, { n: 7, d: 2.0 }],
  amazing_grace: [{ n: 0, d: 1.0 }, { n: 5, d: 2.0 }, { n: 9, d: 0.5 }, { n: 7, d: 0.5 }, { n: 5, d: 2.0 }, { n: 9, d: 1.0 }, { n: 7, d: 3.0 }, { n: 5, d: 1.0 }, { n: 0, d: 3.0 }]
};

function loadPreset(name) {
  const root = parseInt(document.getElementById('sel-root').value);
  const raw = PRESETS[name] || PRESETS.native_motif;

  scoreNotes = [];
  raw.forEach(item => {
    const qMidi = quantizeMidi(root + item.n);
    scoreNotes.push({
      midi: qMidi,
      holes: midiToHoles(qMidi),
      duration: item.d * 0.75
    });
  });
  renderRibbon();
  rebuild3DFlute();
}

function quantizeScore() {
  scoreNotes.forEach(s => {
    s.midi = quantizeMidi(s.midi);
    s.holes = midiToHoles(s.midi);
  });
  renderRibbon();
  rebuild3DFlute();
}

const PX_PER_SEC = 80;

function renderRibbon(activeIdx = -1) {
  const track = document.getElementById('breath-ribbon-track');
  track.querySelectorAll('.note-pill').forEach(el => el.remove());

  scoreNotes.forEach((s, idx) => {
    const w = Math.max(50, s.duration * PX_PER_SEC);

    const pill = document.createElement('div');
    pill.className = `note-pill ${idx === activeIdx ? 'active' : ''}`;
    pill.style.width = `${w}px`;

    pill.onclick = () => cycleNote(idx);
    pill.oncontextmenu = (e) => {
      e.preventDefault();
      if (scoreNotes.length > 1) {
        scoreNotes.splice(idx, 1);
        renderRibbon();
      }
    };

    const dots = s.holes.map(h => `<div class="pill-dot ${h ? 'closed' : 'open'}"></div>`).join('');

    pill.innerHTML = `
      <div class="pill-pitch">${getMidiName(s.midi)}</div>
      <div class="pill-dots">${dots}</div>
      <div class="pill-dur">${s.duration.toFixed(1)}s</div>
    `;

    track.appendChild(pill);
  });
}

function cycleNote(idx) {
  const playable = getPlayablePitches();
  const step = scoreNotes[idx];
  const curIdx = playable.indexOf(step.midi);
  const nextIdx = (curIdx + 1) % playable.length;
  step.midi = playable[nextIdx];
  step.holes = midiToHoles(step.midi);
  renderRibbon();
}

function addNote() {
  const root = parseInt(document.getElementById('sel-root').value);
  const qMidi = quantizeMidi(root);
  scoreNotes.push({
    midi: qMidi,
    holes: midiToHoles(qMidi),
    duration: 1.0
  });
  renderRibbon();
}

// 3D GPU Engine — Authentic SCAD Model Rendering
let scene, camera, renderer, controls;
let fluteRootGroup = null;
let toneHoleMeshes = [], fingerMeshes = [];

function init3D() {
  const container = document.getElementById('viewport-container');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 4000);
  camera.position.set(0, -220, 480);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('viewport-canvas'), antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const light = new THREE.DirectionalLight(0xffedd5, 0.95);
  light.position.set(150, -150, 400);
  scene.add(light);

  const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.4);
  fillLight.position.set(-150, 150, -200);
  scene.add(fillLight);

  fluteRootGroup = new THREE.Group();
  scene.add(fluteRootGroup);

  rebuild3DFlute();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

// Rebuild authentic OpenSCAD flute geometry
function rebuild3DFlute() {
  if (!fluteRootGroup) return;

  // Clear previous geometry
  while (fluteRootGroup.children.length > 0) {
    fluteRootGroup.remove(fluteRootGroup.children[0]);
  }
  toneHoleMeshes = [];
  fingerMeshes = [];

  const rootMidi = parseInt(document.getElementById('sel-root').value);
  const numHoles = parseInt(document.getElementById('sel-holes').value);
  const scaleKey = document.getElementById('sel-scale').value;
  const scaleIntervals = SCALES[scaleKey] || SCALES.minor_pentatonic;

  // Calculate actual acoustic lengths & bore dimensions matching acoustics.py
  const fMel = midiToFreq(rootMidi);
  const fD1 = midiToFreq(rootMidi);
  const fD2 = midiToFreq(rootMidi + 7);

  let boreM = 19.0, boreD1 = 22.0, boreD2 = 16.0;
  if (rootMidi <= 46) { boreM = 40.0; boreD1 = 46.0; boreD2 = 34.0; }
  else if (rootMidi <= 58) { boreM = 28.0; boreD1 = 32.0; boreD2 = 24.0; }
  else if (rootMidi >= 74) { boreM = 12.0; boreD1 = 14.0; boreD2 = 10.0; }

  const lMel = (343200.0 / (2.0 * fMel)) - 1.6 * boreM;
  const lD1 = (343200.0 / (2.0 * fD1)) - 1.6 * boreD1;
  const lD2 = (343200.0 / (2.0 * fD2)) - 1.6 * boreD2;

  const totalBodyLen = Math.max(lMel, lD1, lD2);
  const headLen = 42.0;
  const outerD = Math.max(boreM, boreD1, boreD2) + 8.0;
  const spacing = outerD * 0.95;

  const matWood = new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 0.35, metalness: 0.12 });
  const matMouthpiece = new THREE.MeshStandardMaterial({ color: 0x8a633f, roughness: 0.4 });
  const matChimney = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.3 });

  // Center coordinate: Fipple sound windows at Z = 0
  // Flute body extends downward along -Y, Head joint extends upward along +Y
  const bodyGroup = new THREE.Group();
  bodyGroup.position.set(0, totalBodyLen / 2, 0); // Center in view
  fluteRootGroup.add(bodyGroup);

  // 1. Triple Drone Body Tubes (Melody Center, Drone 1 Left, Drone 2 Right)
  // Melody Tube (Center)
  const geomMel = new THREE.CylinderGeometry(outerD/2, outerD/2, lMel, 6);
  const meshMel = new THREE.Mesh(geomMel, matWood);
  meshMel.position.set(0, -lMel/2, 0);
  bodyGroup.add(meshMel);

  // Drone 1 Tube (Left)
  const geomD1 = new THREE.CylinderGeometry(outerD/2, outerD/2, lD1, 6);
  const meshD1 = new THREE.Mesh(geomD1, matWood);
  meshD1.position.set(-spacing, -lD1/2, 0);
  bodyGroup.add(meshD1);

  // Drone 2 Tube (Right)
  const geomD2 = new THREE.CylinderGeometry(outerD/2, outerD/2, lD2, 6);
  const meshD2 = new THREE.Mesh(geomD2, matWood);
  meshD2.position.set(spacing, -lD2/2, 0);
  bodyGroup.add(meshD2);

  // 2. Converging Mouthpiece Beak (Top Head Joint)
  const geomBeak = new THREE.CylinderGeometry(spacing * 0.8, spacing * 1.3, headLen, 6);
  const meshBeak = new THREE.Mesh(geomBeak, matMouthpiece);
  meshBeak.position.set(0, headLen/2, 0);
  bodyGroup.add(meshBeak);

  // 3. Fipple Sound Windows & Labium Wedges at Z = 0
  const matWindow = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.8 });
  [-spacing, 0, spacing].forEach(xPos => {
    const geomWin = new THREE.BoxGeometry(boreM * 0.45, 5.5, 3.5);
    const winMesh = new THREE.Mesh(geomWin, matWindow);
    winMesh.position.set(xPos, -2.5, outerD/2 - 0.5);
    bodyGroup.add(winMesh);
  });

  // 4. Exact Acoustic Tone Holes & Raised Chimney Pads (on Melody Tube)
  // Distance from fipple = c / (2 * freq) - 1.6 * bore
  const matHand = new THREE.MeshStandardMaterial({ color: 0xe2a77f, roughness: 0.5 });
  const fingerGeom = new THREE.CylinderGeometry(4.5, 4.5, 16, 16);

  const numFund = Math.min(scaleIntervals.length, numHoles + 1);
  for (let hIdx = 0; hIdx < numHoles; hIdx++) {
    const targetInterval = scaleIntervals[hIdx + 1] || (12 * (hIdx + 1) / (numHoles + 1));
    const hFreq = midiToFreq(rootMidi + targetInterval);
    const hDist = Math.max(25, (343200.0 / (2.0 * hFreq)) - 1.6 * boreM);

    const holeY = -hDist; // Relative to fipple at Y = 0

    // Raised Chimney Pad
    const geomChimney = new THREE.CylinderGeometry(5.5, 6.5, 2.5, 6);
    const chimneyMesh = new THREE.Mesh(geomChimney, matChimney);
    chimneyMesh.rotation.x = Math.PI / 2;
    chimneyMesh.position.set(0, holeY, outerD/2);
    bodyGroup.add(chimneyMesh);

    // Tone Hole Sound Core (Radiates Cyan when open)
    const matHole = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x06b6d4, emissiveIntensity: 0.0 });
    const geomHole = new THREE.CylinderGeometry(3.2, 3.2, 3.0, 16);
    const holeMesh = new THREE.Mesh(geomHole, matHole);
    holeMesh.rotation.x = Math.PI / 2;
    holeMesh.position.set(0, holeY, outerD/2 + 0.8);
    bodyGroup.add(holeMesh);
    toneHoleMeshes.push(holeMesh);

    // Articulated 3D Finger Mesh Hovering Over Tone Hole
    const fMesh = new THREE.Mesh(fingerGeom, matHand);
    fMesh.rotation.x = Math.PI / 3;
    fMesh.position.set((hIdx < Math.ceil(numHoles/2) ? -10 : 10), holeY, outerD/2 + 14);
    bodyGroup.add(fMesh);
    fingerMeshes.push(fMesh);
  }

  document.getElementById('lbl-viewport-title').innerText = `Parametric ${numHoles}-Hole Triple Flute (${rootMidi} Root)`;
  document.getElementById('lbl-viewport-sub').innerText = `Height: ${(totalBodyLen + headLen).toFixed(1)} mm • Melody Bore: ${boreM.toFixed(1)} mm • Exact SCAD Chimneys`;
}

function update3DFingersPose(activeHoles) {
  fingerMeshes.forEach((fMesh, idx) => {
    const isCovered = (activeHoles && idx < activeHoles.length) ? activeHoles[idx] : true;
    const targetZ = isCovered ? 6.0 : 16.0;
    fMesh.position.z += (targetZ - fMesh.position.z) * 0.35;

    if (toneHoleMeshes[idx]) {
      toneHoleMeshes[idx].material.color.setHex(isCovered ? 0x221c16 : 0x06b6d4);
      toneHoleMeshes[idx].material.emissive.setHex(isCovered ? 0x000000 : 0x06b6d4);
      toneHoleMeshes[idx].material.emissiveIntensity = isCovered ? 0.0 : 0.85;
    }
  });
}

// Live Bio-Acoustic Audio Engine
class WebPhysicalPipe {
  constructor(sampleRate, boreDiameter = 19.0) {
    this.sr = sampleRate;
    const baseQ = 26.0 + (boreDiameter / 25.0) * 14.0;
    this.modes = [
      { freqMult: 1.0, gain: 1.00, q: baseQ, y1: 0, y2: 0, x1: 0, x2: 0, b0: 0, a1: 0, a2: 0 },
      { freqMult: 2.0, gain: 0.20, q: baseQ * 0.85, y1: 0, y2: 0, x1: 0, x2: 0, b0: 0, a1: 0, a2: 0 },
      { freqMult: 3.0, gain: 0.05, q: baseQ * 0.70, y1: 0, y2: 0, x1: 0, x2: 0, b0: 0, a1: 0, a2: 0 }
    ];
    this.jetDelay = new Float32Array(Math.floor(sampleRate * 0.05));
    this.writeJet = 0;
    this.noiseState = 0;
    this.sacState = 0;
    this.currFreq = 440.0;
    this.targetFreq = 440.0;
    this.updateCoeffs(440.0);
  }

  updateCoeffs(freq) {
    for (let m of this.modes) {
      const f = Math.min(this.sr * 0.45, freq * m.freqMult);
      const w0 = 2.0 * Math.PI * f / this.sr;
      const alpha = Math.sin(w0) / (2.0 * m.q);
      m.b0 = (Math.sin(w0) / 2.0) / (1.0 + alpha);
      m.a1 = (-2.0 * Math.cos(w0)) / (1.0 + alpha);
      m.a2 = (1.0 - alpha) / (1.0 + alpha);
    }
  }

  setFreq(freq) { if (freq > 20.0) this.targetFreq = freq; }

  process(breathP) {
    if (breathP <= 0.0001) return 0.0;
    if (Math.abs(this.targetFreq - this.currFreq) > 0.1) {
      this.currFreq += (this.targetFreq - this.currFreq) * 0.03;
      this.updateCoeffs(this.currFreq);
    }

    this.sacState = this.sacState * 0.85 + breathP * 0.15;
    const effB = this.sacState;

    const rawN = Math.random() * 2.0 - 1.0;
    this.noiseState = this.noiseState * 0.92 + rawN * 0.08;
    const pJet = effB + this.noiseState * 0.0015 * Math.sqrt(effB);

    let pAcoustic = 0;
    for (let m of this.modes) pAcoustic += m.y1 * m.gain;

    const dJet = Math.max(2.0, (this.sr / this.currFreq) * 0.25);
    this.jetDelay[this.writeJet] = pAcoustic * 0.65 + this.noiseState * 0.0005;
    this.writeJet = (this.writeJet + 1) % this.jetDelay.length;

    const delayed = this.jetDelay[(this.writeJet - 1 - Math.floor(dJet) + this.jetDelay.length) % this.jetDelay.length];
    const qVortex = pJet * Math.tanh(delayed * 1.35 + this.noiseState * 0.0015);

    let totalOut = 0;
    for (let m of this.modes) {
      const y = m.b0 * (qVortex - m.x2) - m.a1 * m.y1 - m.a2 * m.y2;
      m.x2 = m.x1; m.x1 = qVortex;
      m.y2 = m.y1; m.y1 = y;
      totalOut += y * m.gain;
    }
    return totalOut * 0.22;
  }
}

let liveMelPipe = null, liveD1Pipe = null, liveD2Pipe = null;
let currentPlaybackTime = 0.0;

async function startAudio() {
  if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') await audioContext.resume();

  const sr = audioContext.sampleRate;
  liveMelPipe = new WebPhysicalPipe(sr, 19.0);
  liveD1Pipe = new WebPhysicalPipe(sr, 22.0);
  liveD2Pipe = new WebPhysicalPipe(sr, 16.0);

  const root = parseInt(document.getElementById('sel-root').value);
  liveD1Pipe.setFreq(midiToFreq(root));
  liveD2Pipe.setFreq(midiToFreq(root + 7));

  currentPlaybackTime = 0.0;
  isAudioRunning = true;

  liveProcessorNode = audioContext.createScriptProcessor(2048, 1, 2);
  masterGainNode = audioContext.createGain();
  masterGainNode.connect(audioContext.destination);

  dummyOsc = audioContext.createOscillator();
  dummyGain = audioContext.createGain();
  dummyGain.gain.value = 0.0;
  dummyOsc.connect(dummyGain);
  dummyGain.connect(liveProcessorNode);
  dummyOsc.start();

  liveProcessorNode.onaudioprocess = (e) => {
    if (!isAudioRunning) return;
    const outL = e.outputBuffer.getChannelData(0);
    const outR = e.outputBuffer.getChannelData(1);

    const totalDur = scoreNotes.reduce((s, b) => s + b.duration, 0) || 4.0;
    const dt = 1.0 / sr;

    for (let i = 0; i < 2048; i++) {
      currentPlaybackTime += dt;
      if (currentPlaybackTime >= totalDur) currentPlaybackTime = 0.0;

      let activeStep = null;
      let accum = 0;
      for (let s of scoreNotes) {
        if (currentPlaybackTime >= accum && currentPlaybackTime < accum + s.duration) {
          activeStep = s;
          break;
        }
        accum += s.duration;
      }

      if (activeStep) liveMelPipe.setFreq(midiToFreq(activeStep.midi));

      const sM = liveMelPipe.process(activeStep ? 0.70 : 0.0);
      const sD1 = liveD1Pipe.process(0.60);
      const sD2 = liveD2Pipe.process(0.50);

      const dryL = (sD1 * 0.35 + sD2 * 0.18 + sM * 0.65) * 0.45;
      const dryR = (sD1 * 0.18 + sD2 * 0.35 + sM * 0.65) * 0.45;

      outL[i] = Math.tanh(dryL * 0.85);
      outR[i] = Math.tanh(dryR * 0.85);
    }
  };

  liveProcessorNode.connect(masterGainNode);
  document.getElementById('btn-play').innerText = 'Playing Flute & 3D Hands... 🪈';

  if (window.playheadTimer) clearInterval(window.playheadTimer);
  window.playheadTimer = setInterval(() => {
    if (!isAudioRunning) return;
    let accum = 0;
    let activeIdx = -1;
    for (let i = 0; i < scoreNotes.length; i++) {
      if (currentPlaybackTime >= accum && currentPlaybackTime < accum + scoreNotes[i].duration) {
        activeIdx = i;
        break;
      }
      accum += scoreNotes[i].duration;
    }
    
    const ph = document.getElementById('ribbon-playhead');
    if (ph) ph.style.left = `${currentPlaybackTime * PX_PER_SEC + 10}px`;

    renderRibbon(activeIdx);
    if (activeIdx >= 0) {
      update3DFingersPose(scoreNotes[activeIdx].holes);
    }
  }, 30);
}

function stopAudio() {
  isAudioRunning = false;
  if (dummyOsc) { try { dummyOsc.stop(); dummyOsc.disconnect(); } catch(e){} }
  if (liveProcessorNode) liveProcessorNode.disconnect();
  if (window.playheadTimer) clearInterval(window.playheadTimer);
  renderRibbon(-1);
  update3DFingersPose([]);
  document.getElementById('btn-play').innerText = '▶ Play Physical Engine';
}

document.getElementById('btn-play').addEventListener('click', async () => {
  if (isAudioRunning) stopAudio();
  else await startAudio();
});
document.getElementById('btn-stop').addEventListener('click', stopAudio);

// Scale, Hole Count & Root Listeners with Auto-Quantization
document.getElementById('sel-holes').addEventListener('change', quantizeScore);
document.getElementById('sel-scale').addEventListener('change', quantizeScore);
document.getElementById('sel-root').addEventListener('change', quantizeScore);
document.getElementById('sel-preset-melody').addEventListener('change', (e) => {
  loadPreset(e.target.value);
});

// Download OpenSCAD
document.getElementById('btn-export-scad').addEventListener('click', async () => {
  const root = parseInt(document.getElementById('sel-root').value);
  const scaleKey = document.getElementById('sel-scale').value;
  const numHoles = parseInt(document.getElementById('sel-holes').value);
  const profile = document.getElementById('sel-profile').value;

  let scadContent = `// Parametric Flute CAD\n$fn = 60;\n`;
  if (pyodideInstance) {
    try {
      scadContent = await pyodideInstance.runPythonAsync(`
from flute_generator.acoustics import calculate_flute_geometry
from flute_generator.cad import generate_scad_content
from flute_generator.scales import SCALES

scale_ints = SCALES.get('${scaleKey}', SCALES['minor_pentatonic'])[:${numHoles} + 1]
dims = calculate_flute_geometry(root_midi=${root}, scale_intervals=scale_ints, windway_profile='${profile}')
generate_scad_content(dims)
`);
    } catch(e){}
  }
  const blob = new Blob([scadContent], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `flute_${root}_${numHoles}holes.scad`;
  a.click();
});
