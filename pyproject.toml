[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flute-generator"
version = "0.1.0"
description = "A CLI tool to calculate acoustics, generate 3D printable OpenSCAD drone flutes, and synthesize audio previews with SoundFonts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
dependencies = [
    "mido==1.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
flute-generator = "flute_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
